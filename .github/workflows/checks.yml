name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Engine regressions without model downloads
        run: bash scripts/test-kit.sh
      - name: Search service scheduling regressions
        run: bash scripts/test-search-service.sh
      - name: Native organizer command regressions
        run: bash scripts/test-organizer-commands.sh

  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Preview cache regressions
        shell: bash
        run: node --test shell/tests/*.test.cjs
      - name: Shell regressions
        run: cargo test --locked --manifest-path shell/src-tauri/Cargo.toml
